apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-secret
    app.kubernetes.io/part-of: argocd
type: Opaque
data:
  # Generate a unique password hash. Do not commit the password or its hash.
  admin.password: REPLACE_WITH_BASE64_BCRYPT_HASH
